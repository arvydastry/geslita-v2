{% import '_macros.html' as m %}
{% set h = home.hero %}
<section class="hero" data-parallax-root>
  <div class="hero-bg">
    <div class="glow"></div>
    <div class="plan" data-parallax="0.35"><img src="assets/img/plan-lines.png" alt="" aria-hidden="true" data-mouse="-22"></div>
  </div>
  <div class="hero-smoke" aria-hidden="true" data-parallax="-0.12">
    <video data-smoke data-src-lg="assets/video/dumai-1600.mp4" data-src-sm="assets/video/dumai-720.mp4" poster="assets/img/dumai-poster.webp" muted loop playsinline disablepictureinpicture preload="none" tabindex="-1"></video>
  </div>
  <div class="wrap">
    <div class="hero-copy">
      <p class="hero-badge hero-anim">{{ h.badge }}</p>
      <h1>{{ h.title }}</h1>
      <p class="lead hero-anim">{{ h.lead }}</p>
      <div class="btn-group hero-anim">{{ m.btn(h.primary.label, h.primary.href) }}{{ m.btn(h.secondary.label, h.secondary.href, 'btn-line', '') }}</div>
    </div>
    <div class="hero-stack">
      <div class="ph ph-main" data-parallax="0.12"><div class="ml" data-mouse="10"><img src="{{ img(h.photos.main.src) }}" alt="{{ h.photos.main.alt }}" width="1880" height="1253" fetchpriority="high" sizes="(max-width: 960px) 92vw, 40vw"></div></div>
      <div class="ph ph-b hero-anim" data-parallax="-0.22"><div class="ml" data-mouse="26"><img src="{{ img(h.photos.b.src) }}" alt="{{ h.photos.b.alt }}" width="1880" height="1253" loading="eager" sizes="(max-width: 960px) 40vw, 16vw"></div></div>
      <div class="ph ph-a hero-anim" data-parallax="0.3"><div class="ml" data-mouse="18"><img src="{{ img(h.photos.a.src) }}" alt="{{ h.photos.a.alt }}" width="1880" height="1253" loading="eager" sizes="(max-width: 960px) 46vw, 20vw"></div></div>
    </div>
  </div>
</section>
